<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign up | Stackly Rehabilitation Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
<div class="au">
  <aside class="au-side">
    <div class="au-arch"><img src="assets/images/therapy.webp" alt="Woman stretching in a calm rehabilitation studio"></div>
    <h2>Begin with one small step.</h2>
    <p>Create an account to book sessions, track your progress and reach your care team any time.</p>
  </aside>
  <main class="au-main">
    <div class="au-top"><a class="logo" href="index.html" aria-label="Stackly home"><img src="assets/images/stackly-logo.webp" alt="Stackly" width="343" height="100"></a><a href="index.html" class="btn btn-ghost btn-sm">Back to home</a></div>
    <div class="au-card">
      <h1>Create your account</h1>
      <p class="au-lead">It takes less than a minute. Every detail stays confidential.</p>
      <div class="ok" id="ok" role="status">Account created. Taking you to the login page.</div>
      <form id="signupForm" novalidate style="margin-top:1.5rem">
        <div class="fld"><label for="name">Full name</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Your full name" data-rule="name"><span class="err" role="alert"></span></div>
        <div class="fld"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" data-rule="email"><span class="err" role="alert"></span></div>
        <div class="fld"><label for="role">I am a</label><select id="role" name="role" data-rule="role"><option value="">Select one</option><option value="patient">Patient</option><option value="therapist">Therapist</option></select><span class="err" role="alert"></span></div>
        <div class="fld"><label for="pw">Password</label><div class="pw"><input id="pw" name="password" type="password" autocomplete="new-password" placeholder="Letters and numbers, 8+ characters" data-rule="newPw"><button type="button" class="pw-t" aria-label="Show password">Show</button></div><span class="err" role="alert"></span></div>
        <div class="fld"><label for="cpw">Confirm password</label><input id="cpw" name="confirm" type="password" autocomplete="new-password" placeholder="Repeat your password" data-rule="confirm"><span class="err" role="alert"></span></div>
        <div class="fld"><label class="chk"><input type="checkbox" name="terms" data-rule="terms"><span>I agree to the Terms and Privacy Policy.</span></label><span class="err" role="alert"></span></div>
        <button class="btn full" type="submit">Create account</button>
      </form>
      <p class="au-alt">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
