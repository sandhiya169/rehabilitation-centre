<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Stackly Rehabilitation Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
<div class="au">
  <aside class="au-side">
    <div class="au-arch"><img src="assets/images/dignity.webp" alt="Person meditating at sunrise"></div>
    <h2>Recovery has a place to begin.</h2>
    <p>Sign in to follow your plan, see your sessions and stay close to your care team.</p>
  </aside>
  <main class="au-main">
    <div class="au-top"><a class="logo" href="index.html" aria-label="Stackly home"><img src="assets/images/stackly-logo.webp" alt="Stackly" width="343" height="100"></a><a href="index.html" class="btn btn-ghost btn-sm">Back to home</a></div>
    <div class="au-card">
      <h1 id="title">Welcome back</h1>
      <p class="au-lead" id="lead">Sign in to your patient account.</p>
      <div class="seg" role="group" aria-label="Login as">
        <button type="button" data-role="user" aria-pressed="true">Patient</button>
        <button type="button" data-role="admin" aria-pressed="false">Therapist</button>
      </div>
      <form id="loginForm" novalidate>
        <div class="fld"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" data-rule="email"><span class="err" role="alert"></span></div>
        <div class="fld"><label for="pw">Password</label><div class="pw"><input id="pw" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" data-rule="loginPw"><button type="button" class="pw-t" aria-label="Show password">Show</button></div><span class="err" role="alert"></span></div>
        <div class="row-between"><a href="404.html">Forgot password?</a></div>
        <button class="btn full" type="submit">Login</button>
      </form>
      <div class="or">or continue with</div>
      <div class="soc">
        <a href="404.html" class="soc-btn"><i class="fa-brands fa-google" aria-hidden="true"></i>Sign in with Google</a>
        <a href="404.html" class="soc-btn"><i class="fa-brands fa-facebook" aria-hidden="true"></i>Sign in with Facebook</a>
      </div>
      </div>
      <p class="au-alt">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
